distributed:
  enabled: false

standalone:
  enabled: true
  loki:
    storage:
      bucketNames:
        chunks: broking-staging-pod-logs
        ruler: broking-staging-pod-logs
        admin: broking-staging-pod-logs
      type: s3
      s3:
        region: ap-south-1
        s3forcepathstyle: false
        sse_encryption: true
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    ingester:
      chunk_encoding: snappy
    tracing:
      enabled: true
    querier:
      # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
      max_concurrent: 2

  deploymentMode: SingleBinary
  lokiCanary:
    enabled: false
  test:
    enabled: false
  singleBinary:
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 1Gi
    extraEnv:
      # Keep a little bit lower than memory limits
      - name: GOMEMLIMIT
        value: 3750MiB

  chunksCache:
    # default is 500MB, with limited memory keep this smaller
    writebackSizeLimit: 10MB
    allocatedMemory: 1024

  serviceAccount:
    create: true
    name: loki-sa
    imagePullSecrets: []
    labels: {}
    annotations: 
      eks.amazonaws.com/role-arn: arn:aws:iam::686255949108:role/logs_s3
    automountServiceAccountToken: true

  # Enable minio for storage
  minio:
    enabled: false
    persistence:
      size: 10Gi

  # Zero out replica counts of other deployment modes
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0

promtail:
  config:
    logLevel: info
    clients:
      - url: http://logging-gateway/loki/api/v1/push